{% extends 'blog/base.html' %}

{% block content %}
    <article class="post">
        <h2>{{ post.title }}</h2>
        <p class="date">
            作者：{{ post.author }}{% if post.published_date %} · 发布于：{{ post.published_date }}{% endif %}
        </p>
        {{ post.text|markdown }}
        <a class="btn btn-outline-secondary btn-sm" href="/">← 返回列表</a>
    </article>
{% endblock %}
