{% extends 'blog/base.html' %}

{% block content %}
    {% for post in posts %}
        <article class="post">
            <h2><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h2>
            <p class="date">
                作者：{{ post.author }}{% if post.published_date %} · 发布于：{{ post.published_date }}{% endif %}
            </p>
            <p>{{ post.text|truncatewords:50|linebreaksbr }}</p>
            <a class="btn btn-outline-secondary btn-sm" href="{% url 'post_detail' pk=post.pk %}">阅读全文 →</a>
        </article>
    {% endfor %}
{% endblock %}
